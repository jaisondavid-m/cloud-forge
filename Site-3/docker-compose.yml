# ============================================================
# CloudForge Site-2 (Recovery Site) — Docker Compose
# ============================================================
# Usage:
#   docker compose up --build          (foreground)
#   docker compose up --build -d       (detached)
#   docker compose down                (stop & remove)
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudforge-site2-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      # Read-only bind-mount of host EFS path (from .env EFS_MOUNT_PATH, defaulting to /mnt/shared)
      - ${EFS_MOUNT_PATH:-/mnt/shared}:/mnt/efs/shared:ro
    environment:
      - EFS_MOUNT_PATH=/mnt/efs/shared
      - HOST=0.0.0.0
      - PORT=8001
      - SITE_NAME=Site-2 (Recovery Site)
      - SITE_ID=site-2
      - READ_ONLY_MODE=true
      - FRONTEND_ORIGIN=*
      - MAX_PREVIEW_BYTES=1048576
      - MAX_FILE_LIST_COUNT=1000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudforge-site2-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5175:80"
    depends_on:
      backend:
        condition: service_healthy
