# ============================================================
# CloudForge Site-1 (Primary) — Docker Compose
# ============================================================
# Usage:
#   docker compose up --build          (foreground)
#   docker compose up --build -d       (detached)
#   docker compose down                (stop & remove)
#
# On EC2 with EFS mounted at /mnt/efs/shared, update the
# volume source path below.
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudforge-site1-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - shared-storage:/mnt/efs/shared
    environment:
      - EFS_MOUNT_PATH=/mnt/efs/shared
      - HOST=0.0.0.0
      - PORT=8000
      - SITE_NAME=Site-1 (Primary)
      - SITE_ID=site-1
      - FRONTEND_ORIGIN=http://localhost:5173,http://127.0.0.1:5173
      - MAX_UPLOAD_SIZE_MB=10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudforge-site1-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  shared-storage:
    driver: local
    # -----------------------------------------------------------
    # LOCAL DEVELOPMENT (default):
    #   Uses a named Docker volume. Files persist across restarts.
    #
    # EC2 DEPLOYMENT with EFS:
    #   Replace this volume definition with a bind mount to the
    #   actual EFS directory:
    #
    #   shared-storage:
    #     driver: local
    #     driver_opts:
    #       type: none
    #       o: bind
    #       device: /mnt/efs/shared
    # -----------------------------------------------------------
